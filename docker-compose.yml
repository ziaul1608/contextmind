services:
  postgres:
    image: postgres:16-alpine
    container_name: contextmind-postgres
    environment:
      POSTGRES_USER: contextmind
      POSTGRES_PASSWORD: contextmind
      POSTGRES_DB: contextmind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contextmind -d contextmind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    name: contextmind_postgres_data
